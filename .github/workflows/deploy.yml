name: Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd ~/Docker/repos/portfolio-meral
          git pull origin main

      - name: Rebuild and restart container
        run: |
          cd ~/Docker/repos/portfolio-meral
          docker compose down
          docker compose up -d --build

      - name: Health check
        run: |
          sleep 5
          curl -sf http://localhost:80 && echo "OK" || echo "FAILED"
