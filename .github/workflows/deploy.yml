name: Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    env:
      HOME: /home/github-runner
      REPO: /home/github-runner/Docker/repos/portfolio-meral
    steps:
      - name: Pull latest code
        run: |
          git config --global --add safe.directory $REPO
          cd $REPO
          git pull origin main

      - name: Rebuild and restart container
        run: |
          cd $REPO
          docker compose down
          docker compose up -d --build

      - name: Health check
        run: |
          sleep 5
          curl -sf http://localhost:80 && echo "OK" || echo "FAILED"
